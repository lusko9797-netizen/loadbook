<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Loadbook</title>
<meta name="theme-color" content="#151a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Loadbook">
<link rel="manifest" href='data:application/manifest+json,{"name":"Loadbook","short_name":"Loadbook","display":"standalone","background_color":"%23151a1f","theme_color":"%23151a1f","start_url":"."}'>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23151a1f'/%3E%3Crect x='30' y='78' width='120' height='24' rx='6' fill='%23e6b445'/%3E%3Crect x='22' y='58' width='22' height='64' rx='5' fill='%23e6b445'/%3E%3Crect x='136' y='58' width='22' height='64' rx='5' fill='%23e6b445'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#151a1f; --panel:#1d2329; --line:#2b333b; --ink:#e9edf0; --mute:#8a949e; --dim:#5d6873;
  --gold:#e6b445; --gold-ink:#1a1305; --teal:#57b8a2; --red:#d9694f;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Barlow Semi Condensed",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.35;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none;color:var(--ink)}
input:focus,select:focus{border-color:var(--gold)}
input::placeholder{color:var(--dim)}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
#app{min-height:100%;padding:calc(var(--sat) + 14px) 16px calc(var(--sab) + 84px);max-width:560px;margin:0 auto}
h1{font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
h2{font-size:20px;font-weight:600;margin:22px 0 8px}
.sub{color:var(--mute)}
.small{font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:600;text-align:center;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.ghost{background:none}
.btn.danger{color:var(--red)}
.btn.block{width:100%;display:block}
.btn:disabled{opacity:.4}
.card{background:var(--panel);border-radius:14px;padding:14px;border:1px solid var(--line)}
.icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--mute);font-size:18px}
.icon:active{background:var(--line)}

.pic{width:44px;height:44px;flex:none;border-radius:10px;background:var(--bg);display:grid;place-items:center}
.pic svg{width:36px;height:36px;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pic .bd{stroke:var(--ink)}.pic .bar{stroke:var(--gold)}.pic .eq{stroke:var(--dim)}
.ex header{align-items:center;gap:10px}
.ex header .name{flex:1}
/* header */
.hero{padding:6px 0 4px}
.hero .big{font-size:56px;font-weight:700;line-height:1;letter-spacing:-.02em}
.hero .big em{font-style:normal;color:var(--gold)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--teal);margin-right:6px;vertical-align:1px}
.dot.rest{background:var(--dim)}

/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(21,26,31,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(var(--sab) + 6px);display:flex;z-index:10}
nav button{flex:1;padding:8px 4px;border-radius:10px;color:var(--mute);font-size:14px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--gold)}

/* workout logging */
.ex{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.ex header{padding:12px 14px 6px;display:flex;justify-content:space-between;align-items:baseline}
.ex header .name{font-size:19px;font-weight:600}
.ex header .goal{color:var(--mute);font-size:14px}
.sethead,.set{display:grid;grid-template-columns:34px 1fr 1fr 1fr 44px;gap:8px;align-items:center;padding:0 14px}
.sethead{color:var(--dim);font-size:13px;padding-bottom:4px}
.set{padding:5px 14px}
.set:last-of-type{padding-bottom:12px}
.set .n{color:var(--mute);font-weight:600;text-align:center}
.set .last{color:var(--mute);font-size:15px;white-space:nowrap}
.set .last b{color:var(--ink);font-weight:500}
.set input{text-align:center;padding:9px 6px;font-size:18px;font-weight:600;background:var(--bg)}
.set input.beat{border-color:var(--gold);color:var(--gold)}
.set .done{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);margin-left:auto;display:grid;place-items:center;color:var(--dim)}
.set .done.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.ex .addset{padding:0 14px 12px;color:var(--mute);font-size:14px;font-weight:500}
.set.isdone .n{color:var(--gold)}

/* workout timer bar */
.wbar{position:sticky;top:0;z-index:5;background:var(--bg);margin:calc(-14px - var(--sat)) -16px 12px;padding:calc(var(--sat) + 10px) 16px 10px;border-bottom:1px solid var(--line);transition:border-color .3s}
.wtop{display:flex;align-items:center;gap:10px}
.wclock{font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;transition:color .3s}
.wbar .btn{padding:9px 16px}
.wpace{font-size:14px;font-weight:600;padding:6px 10px;border-radius:999px;background:rgba(87,184,162,.14);color:var(--teal);white-space:nowrap}
.wtrack{position:relative;height:10px;border-radius:999px;background:var(--line);margin-top:12px;transition:box-shadow .3s}
.wfill{position:absolute;left:0;top:0;bottom:0;max-width:100%;border-radius:999px;background:var(--gold);transition:width .25s linear,background-color .3s}
#wTicks i{position:absolute;top:2px;bottom:2px;width:2px;margin-left:-1px;border-radius:1px;background:var(--dim)}
#wTicks i.d{background:var(--teal)}
#wTicks i.nx{top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;background:var(--ink)}
.wmeta{color:var(--mute);font-size:14px;margin-top:8px}
.wbar.behind{border-bottom-color:rgba(217,105,79,.6)}
.wbar.behind .wclock{color:var(--red)}
.wbar.behind .wpace{background:rgba(217,105,79,.16);color:var(--red)}
.wbar.behind .wfill{background:var(--red)}
.wbar.behind .wtrack{box-shadow:0 0 0 1px var(--red),0 0 14px 3px rgba(217,105,79,.55);animation:glow 1.4s ease-in-out infinite}
.wbar.done .wpace{background:rgba(230,180,69,.16);color:var(--gold)}
@keyframes glow{50%{box-shadow:0 0 0 1px var(--red),0 0 26px 8px rgba(217,105,79,.85)}}

/* rest timer */
.rest{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:540px;bottom:calc(var(--sab) + 78px);z-index:9;background:#232b33;border:1px solid var(--line);border-radius:16px;padding:10px 10px 10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.rest[hidden]{display:none}
.rtop{display:flex;align-items:center;gap:6px}
.rlabel{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.rclock{font-size:34px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.rb{min-width:50px;height:44px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:16px}
.rb:active{transform:scale(.95)}
.rtrack{height:5px;border-radius:999px;background:var(--line);margin-top:9px;overflow:hidden}
.rfill{height:100%;background:var(--teal);border-radius:999px;transition:width .25s linear}
.rnext{margin-top:7px;font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest.over{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);animation:ring .45s ease-in-out 4}
.rest.over .rlabel,.rest.over .rnext{color:var(--gold-ink);opacity:.8}
.rest.over .rb{background:rgba(0,0,0,.12);border-color:transparent;color:var(--gold-ink)}
.rest.over .rb.adj,.rest.over .rtrack{display:none}
@keyframes ring{50%{transform:translateX(-50%) scale(1.03)}}
body.resting #app{padding-bottom:calc(var(--sab) + 190px)}
body.resting .toast{bottom:calc(var(--sab) + 190px)}

/* settings */
.setting{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}
.setting .t{flex:1}
.setting .t div+div{color:var(--mute);font-size:14px}
.setting input{width:74px;text-align:center}
.sw{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--ink);transition:transform .2s}
.sw[aria-checked=true]{background:var(--gold)}
.sw[aria-checked=true]::after{transform:translateX(20px);background:var(--gold-ink)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper b{min-width:46px;text-align:center;font-size:19px;font-variant-numeric:tabular-nums}
.icon.out{border:1px solid var(--line);color:var(--ink)}

/* program list */
.pitem{display:flex;align-items:center;gap:10px;padding:12px 4px 12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.pitem .name{font-weight:600;font-size:18px}
.pitem .meta{color:var(--mute);font-size:14px}

/* progress */
.chart{width:100%;height:auto;display:block}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.tabs button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);color:var(--mute);font-size:15px;font-weight:500}
.tabs button.on{border-color:var(--gold);color:var(--gold)}
.picbtn{padding:2px!important;border-radius:12px!important}.picbtn .pic{background:transparent}
.pr{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.pr:last-child{border:0}
.hist{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.hist .d{font-weight:600}
.hist .m{color:var(--mute);font-size:14px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .sheet{background:var(--panel);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(var(--sab) + 18px)}
.sheet h2{margin:0 0 14px}
label.f{display:block;color:var(--mute);font-size:14px;margin-bottom:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);text-align:center;bottom:calc(var(--sab) + 90px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:30;animation:pop .2s}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.empty{padding:28px 18px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- cardio + calories ---------- */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 14px 10px}
.cgrid label>span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.cgrid input{text-align:center;font-size:18px;font-weight:600;background:var(--bg)}
.cnote{padding:0 14px 12px;font-size:14px;color:var(--mute)}
.seg{display:inline-flex;flex:none;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{padding:7px 12px;border-radius:8px;font-weight:600;font-size:15px;color:var(--mute)}
.seg button.on{background:var(--gold);color:var(--gold-ink)}

/* ---------- progress page ---------- */
:root{--deemph:#65707b;--cell:#262e36}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi .l{font-size:14px;color:var(--mute)}
.kpi .v{font-size:30px;font-weight:700;line-height:1.1;margin-top:2px;letter-spacing:-.01em;white-space:nowrap}
.kpi .v small{font-size:15px;font-weight:500;color:var(--mute);margin-left:4px;letter-spacing:0}
.kpi .c{font-size:13px;color:var(--mute);margin-top:4px;line-height:1.3}
.wdots{display:flex;justify-content:space-between;margin-top:8px}
.wdots span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--dim);line-height:1}
.wdots i{width:12px;height:12px;border-radius:50%;background:var(--cell)}
.wdots .on i{background:var(--gold)}
.wdots .today{color:var(--ink);font-weight:700}
.wdots .today i{box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--ink)}
.h2row{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 10px;margin:26px 0 10px}
.h2row h2{margin:0;white-space:nowrap}
.h2row>span{font-size:14px;color:var(--mute);text-align:right}
.cal{display:grid;grid-template-columns:16px repeat(12,minmax(0,1fr));gap:4px}
.cal .ml{grid-row:1;font-size:12px;color:var(--mute);white-space:nowrap;line-height:1.3}
.cal .dl{grid-column:1;font-size:11px;color:var(--dim);align-self:center;line-height:1}
.cal i{display:block;aspect-ratio:1;border-radius:4px;background:var(--cell)}
.cal i.on{background:var(--gold)}
.cal i.today{box-shadow:0 0 0 2px var(--ink)}
.cal i.fut{background:transparent;box-shadow:inset 0 0 0 1px var(--cell)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13px;color:var(--mute);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.shv{font-size:40px;font-weight:700;line-height:1}
.shv small{font-size:18px;color:var(--mute);font-weight:500;margin-left:6px}
.shl{font-size:16px;margin-top:6px}
.meter{height:8px;border-radius:999px;background:rgba(87,184,162,.2);margin:12px 0 8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--teal);border-radius:999px}
.lifts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.lift{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.lrow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px 10px 10px;text-align:left}
.lmain{flex:1;min-width:0}
.lname{display:block;font-weight:600;font-size:17px;line-height:1.2}
.lsub{display:block;font-size:14px;color:var(--mute);margin-top:2px}
.lsub .pr{color:var(--gold);font-weight:600;white-space:nowrap}
.lright{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.chg{font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--cell);color:var(--mute);white-space:nowrap}
.chg.up{background:rgba(87,184,162,.16);color:var(--teal)}
.chg.down{background:rgba(217,105,79,.16);color:var(--red)}
.spk{display:block;width:64px;height:22px}
.lift.open .lrow{border-bottom:1px solid var(--line)}
.ldet{padding:6px 14px 12px}
.ctitle{font-size:14px;color:var(--mute);margin:8px 0 0}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 6px}
.facts div{background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0}
.facts span{display:block;font-size:12px;color:var(--mute)}
.facts b{display:block;font-size:17px;line-height:1.25;white-space:nowrap}
.facts em{display:block;font-style:normal;font-size:12px;color:var(--dim)}
.rows{font-size:14px}
.rows>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.rows>div>span:first-child{color:var(--mute);white-space:nowrap}
.rows>div>span:last-child{text-align:right;font-variant-numeric:tabular-nums}
details.more{margin-top:8px}
details.more summary{cursor:pointer;color:var(--mute);font-size:14px;padding:6px 0;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸";display:inline-block;width:14px}
details.more[open] summary::before{content:"▾"}
.xbtn{color:var(--dim);font-size:13px;padding:2px 6px;margin-left:6px}
.bigv{font-size:34px;font-weight:700;line-height:1.1}
.bigv small{font-size:16px;color:var(--mute);font-weight:500;margin-left:4px}
.lc,.bc{display:block;width:100%;height:auto;margin-top:6px;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.lc text,.bc text{font-family:inherit}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.dv{fill:var(--ink);font-size:13px;font-weight:600}
.xh{stroke:var(--mute);stroke-width:1;opacity:0}
.xd{opacity:0}
.bc g path{transition:filter .15s}
.bc g:hover path{filter:brightness(1.25)}
.tip{position:fixed;z-index:40;pointer-events:none;background:#2a333c;border:1px solid #3a444e;border-radius:10px;padding:6px 10px;box-shadow:0 6px 18px rgba(0,0,0,.45);white-space:nowrap}
.tip b{display:block;font-size:16px;line-height:1.2}
.tip span{display:block;font-size:13px;color:var(--mute)}
.tip[hidden]{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="rest" class="rest" hidden>
  <div class="rtop">
    <div class="grow"><div class="rlabel" id="rLabel">Rest</div><div class="rclock" id="rClock" role="timer">0:00</div></div>
    <button class="rb adj" onclick="adjustRest(-15)" aria-label="15 seconds less">−15</button>
    <button class="rb adj" onclick="adjustRest(15)" aria-label="15 seconds more">+15</button>
    <button class="rb" id="rSkip" onclick="skipRest()">Skip</button>
  </div>
  <div class="rtrack"><div class="rfill" id="rFill"></div></div>
  <div class="rnext" id="rNext"></div>
</div>
<div id="tip" class="tip" hidden></div>
<nav id="nav"></nav>

<script>
/* ---------- storage ---------- */
const KEY='loadbook.v1';
let mem=null;
function load(){
  try{const s=localStorage.getItem(KEY); if(s) return JSON.parse(s);}catch(e){}
  return mem||{program:[],sessions:[],active:null,bodyweight:[]};
}
function save(){
  mem=S;
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
}
let S=load();
const MET_KEYS=['normal','hard'];
function normalize(){
  S.bodyweight=S.bodyweight||[];
  S.settings=Object.assign({rest:105,target:null,sound:true,vibrate:true,awake:true,effort:'normal'},S.settings||{});
  if(!MET_KEYS.includes(S.settings.effort))S.settings.effort='normal';
}
normalize();


/* ---------- exercise pictograms (original, inline SVG) ---------- */
const uid=()=>Math.random().toString(36).slice(2,9);
const ICONS={
 bench:`<svg viewBox="0 0 64 64"><rect x="6" y="40" width="52" height="6" rx="2" class="eq"/><path d="M14 46v10M50 46v10" class="eq"/><circle cx="14" cy="34" r="5" class="bd"/><path d="M19 36h22M41 36l6 4" class="bd"/><path d="M26 36v-14M40 36v-14" class="bd"/><path d="M18 22h30" class="bar"/><rect x="16" y="17" width="4" height="10" rx="1" class="bar"/><rect x="46" y="17" width="4" height="10" rx="1" class="bar"/></svg>`,

const fmtDate=d=>new Date(d).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const shortDate=d=>new Date(d).toLocaleDateString(undefined,{day:'numeric',month:'short'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dayStart=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x;};
const num=v=>{const n=parseFloat(v);return isNaN(n)?null:n;};
const $=id=>document.getElementById(id);
const mmss=x=>{x=Math.max(0,Math.floor(x+1e-6));const h=Math.floor(x/3600),m=Math.floor(x%3600/60),sec=String(x%60).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${sec}`:`${m}:${sec}`;};

function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1600);}

function lastSessionFor(exId){
  for(let i=S.sessions.length-1;i>=0;i--){
    const e=S.sessions[i].exercises.find(x=>x.exId===exId);
    if(e && e.sets.some(s=>s.w!=null&&s.r!=null)) return {date:S.sessions[i].date,sets:e.sets};
  }
  return null;
}
function sessionVolume(sess){return sess.exercises.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+((s.w||0)*(s.r||0)),0),0);}
function activeVolume(){let v=0;for(const id in S.active.entries)for(const s of S.active.entries[id])if(s.done)v+=(s.w||0)*(s.r||0);return v;}
function nextWorkoutInfo(){
  if(!S.sessions.length) return {label:'No sessions yet',today:true};
  const last=dayStart(S.sessions[S.sessions.length-1].date);
  const today=dayStart(Date.now());
  const diff=Math.round((today-last)/864e5);
  if(diff<=0) return {label:'Trained today',today:false,rest:true};
  if(diff===1) return {label:'Rest day — next workout tomorrow',today:false,rest:true};
  if(diff===2) return {label:'Workout day',today:true};
  return {label:`${diff} days since last workout`,today:true};
}

function startSession(){
  const entries={};
  for(const ex of S.program){
    const last=lastSessionFor(ex.id);
    const n=Math.max(ex.sets, last?last.sets.length:0);
    entries[ex.id]=Array.from({length:n},()=>({w:null,r:null,done:false}));
  }
  S.active={startedAt:Date.now(),entries,rest:null,cardio:{min:null,kcal:null}};
  save();window.scrollTo(0,0);render();syncWakeLock();unlockAudio();
}
function viewActive(){
  return `

        const att=`data-ex="${ex.id}" data-i="${i}" oninput="onSetInput(this)" onchange="onSetCommit(this)" onkeydown="onSetKey(event,this)"`;
        return `<div class="set${s.done?' isdone':''}" id="set-${ex.id}-${i}">
          <div class="n">${i+1}</div>

          <input type="number" inputmode="decimal" step="any" enterkeyhint="next" data-k="w" ${att} aria-label="Set ${i+1} weight in kg" class="${beat?'beat':''}" placeholder="${L?L.w:''}" value="${s.w??''}">
          <input type="number" inputmode="numeric" enterkeyhint="done" data-k="r" ${att} aria-label="Set ${i+1} reps" class="${beat?'beat':''}" placeholder="${L?L.r:ex.reps}" value="${s.r??''}">
          <button class="done ${s.done?'on':''}" onclick="toggleDone('${ex.id}',${i})" aria-label="Set ${i+1} done">✓</button>
        </div>`;}).join('')}

  <button class="btn ghost danger block" onclick="cancelSession()">Discard workout</button>`;

/* Logging a set. Typing updates the page in place (no full re-render),
   so the keyboard stays open. A set counts as done once it has weight and reps:
   when you leave the field, press Done, tap ✓, or stop typing for 1.5 s. */
let commitT=null,lastCommit={key:'',t:0};
const rowEl=(id,i)=>$(`set-${id}-${i}`);
function paintSet(id,i){
  const row=rowEl(id,i),s=S.active&&S.active.entries[id]&&S.active.entries[id][i];if(!row||!s)return;
  const last=lastSessionFor(id),L=last&&last.sets[i]&&last.sets[i].w!=null?last.sets[i]:null;
  const beat=!!(L&&s.w!=null&&s.r!=null&&(s.w>L.w||(s.w===L.w&&s.r>L.r)));
  row.querySelectorAll('input').forEach(x=>x.classList.toggle('beat',beat));
  row.querySelector('.done').classList.toggle('on',!!s.done);
  row.classList.toggle('isdone',!!s.done);
}
function onSetInput(el){
  const id=el.dataset.ex,i=+el.dataset.i,s=S.active&&S.active.entries[id]&&S.active.entries[id][i];if(!s)return;
  s[el.dataset.k]=num(el.value);save();paintSet(id,i);paintBar();
  clearTimeout(commitT);commitT=setTimeout(()=>commitSet(id,i,true),1500);
}
function onSetCommit(el){clearTimeout(commitT);commitSet(el.dataset.ex,+el.dataset.i,false);}
function onSetKey(e,el){
  if(e.key!=='Enter')return;
  e.preventDefault();
  if(el.dataset.k==='w'){const r=el.parentNode.querySelectorAll('input')[1];if(r)r.focus();}
  else el.blur();
}
function commitSet(id,i,idle){
  const s=S.active&&S.active.entries[id]&&S.active.entries[id][i];if(!s)return;
  if(s.w!=null&&s.r!=null&&!s.done){
    s.done=true;lastCommit={key:id+'|'+i,t:Date.now()};
    save();paintSet(id,i);paintBar();startRest(id+'|'+i);
    // close the keyboard so the rest timer is visible
    const a=document.activeElement;
    if(idle&&a&&a.dataset&&a.dataset.ex===id&&+a.dataset.i===i)a.blur();
  }
}
function toggleDone(id,i){
  if(!S.active)return;
  const s=S.active.entries[id][i],row=rowEl(id,i),key=id+'|'+i;
  clearTimeout(commitT);
  if(s.done){
    if(lastCommit.key===key&&Date.now()-lastCommit.t<700)return; // this same tap already completed it
    s.done=false;save();paintSet(id,i);paintBar();
    const r=S.active.rest;if(r&&r.key===key&&!r.alerted)skipRest();
    return;
  }
  if(s.w==null||s.r==null){
    // tapping ✓ with empty fields copies last session's numbers
    const ex=S.program.find(e=>e.id===id),last=lastSessionFor(id),L=last&&last.sets[i];
    if(L){if(s.w==null)s.w=L.w;if(s.r==null)s.r=L.r;}
    else if(s.r==null&&ex)s.r=ex.reps;
    if(row){const [wi,ri]=row.querySelectorAll('input');wi.value=s.w??'';ri.value=s.r??'';}
    if(s.w==null){save();paintSet(id,i);toast('Enter a weight first');if(row)row.querySelector('input').focus();return;}
  }
  s.done=true;lastCommit={key,t:Date.now()};
  save();paintSet(id,i);paintBar();startRest(key);
}
function addSet(id){S.active.entries[id].push({w:null,r:null,done:false});save();render();}
function cancelSession(){askConfirm('Discard workout?','Nothing from this session will be saved.','Discard',()=>{S.active=null;save();cancelBeeps();syncWakeLock();});}
function finishSession(){
  const exercises=S.program.map(ex=>({exId:ex.id,name:ex.name,sets:(S.active.entries[ex.id]||[]).filter(s=>s.done&&s.w!=null&&s.r!=null).map(s=>({w:s.w,r:s.r}))}));
  const c=S.active.cardio||{},cardio=(c.min>0||c.kcal>0)?{min:c.min||0,kcal:c.kcal!=null?c.kcal:null}:null;
  if(!exercises.some(e=>e.sets.length)&&!cardio){toast('Log a set or some cardio first');return;}
  const prs=[];
  for(const e of exercises){
    if(!e.sets.length)continue;
    const top=Math.max(...e.sets.map(s=>s.w));
    const prevTop=maxWeightEver(e.exId);
    if(prevTop!=null&&top>prevTop)prs.push(e.name);
  }
  const dur=Date.now()-S.active.startedAt;
  const sess={id:uid(),date:Date.now(),dur,exercises,met:MET[S.settings.effort]};
  if(cardio)sess.cardio=cardio;
  S.sessions.push(sess);
  S.active=null;save();cancelBeeps();syncWakeLock();
  const k=kcalTxt(sessionKcal(sess));
  toast((prs.length?'New best: '+prs.join(', '):'Workout saved')+` · ${Math.round(dur/60000)} min${k?' · '+k:''}`);
  render();
}
function maxWeightEver(exId){
  let m=null;for(const s of S.sessions)for(const e of s.exercises)if(e.exId===exId)for(const st of e.sets)if(m==null||st.w>m)m=st.w;return m;
}

function openEx(id){

    <div class="stack">

      <div><label class="f">Picture</label><div class="tabs" style="margin:0" id="iconpick">${Object.keys(ICONS).map(k=>`<button type="button" class="picbtn ${(ex.icon||'generic')===k?'on':''}" data-k="${k}" onclick="pickIcon(this)"><span class="pic">${ICONS[k]}</span></button>`).join('')}</div></div>
      <div class="row">

    </div>
  </div></div>`;
  render();setTimeout(()=>document.getElementById('exn')?.focus(),50);
}
function pickIcon(b){document.querySelectorAll('.picbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');}
function saveEx(id){
  const name=document.getElementById('exn').value.trim(), sets=Math.max(1,num(document.getElementById('exs').value)||3), reps=Math.max(1,num(document.getElementById('exr').value)||8);
  const icon=document.querySelector('.picbtn.on')?.dataset.k||'generic';
  if(!name){toast('Give it a name');return;}
  if(id){const ex=S.program.find(e=>e.id===id);Object.assign(ex,{name,sets,reps,icon});for(const s of S.sessions)for(const e of s.exercises)if(e.exId===id)e.name=name;}
  else S.program.push({id:uid(),name,sets,reps,icon});
  save();closeModal();
}
function delEx(id){askConfirm('Remove exercise?','It leaves the program. Past logs are kept.','Remove',()=>{S.program=S.program.filter(e=>e.id!==id);save();});}
function moveEx(i,d){const j=i+d;[S.program[i],S.program[j]]=[S.program[j],S.program[i]];save();render();}
function loadPreset(i){
  const p=PRESETS[i];
  if(S.active){toast('Finish or discard the current workout first');return;}
  const apply=()=>{S.program=p.ex.map(([name,sets,reps,icon])=>({id:uid(),name,sets,reps,icon}));save();window.scrollTo(0,0);toast(p.ex.length?p.name+' loaded':'Program cleared');};
  if(S.program.length)askConfirm('Load '+p.name+'?','This replaces your current exercise list. History is kept.','Load',apply);else{apply();render();}
}

/* ---------- calories burned ---------- */
// Lifting: MET × body weight (kg) × hours spent lifting.
//   Normal 3.5 = "resistance training, multiple exercises, 8-15 reps"; Hard 6 = vigorous weight training.
// Cardio: the calories you type in (from the machine). Left empty, it's estimated at 6 METs.
const MET={normal:3.5,hard:6},CARDIO_MET=6;
function bwAt(t){
  let best=null,first=null;
  for(const b of S.bodyweight){if(!first||b.date<first.date)first=b;if(b.date<=t&&(!best||b.date>best.date))best=b;}
  const e=best||first;return e?e.w:null;
}
function cardioKcal(c,kg){if(!c)return 0;if(c.kcal!=null)return c.kcal;return c.min&&kg?Math.round(CARDIO_MET*kg*c.min/60):0;}
function sessionKcal(s){
  const kg=bwAt(s.date),cm=(s.cardio&&s.cardio.min)||0,sets=s.exercises.some(e=>e.sets.length);
  const dur=s.dur||planFor(s.exercises.map(e=>e.sets.length),true).total*1000; // older workouts: estimated length
  const lift=kg&&sets?Math.round((s.met||MET[S.settings.effort]||3.5)*kg*Math.max(0,dur/3.6e6-cm/60)):0;
  const cardio=cardioKcal(s.cardio,kg);
  return {lift,cardio,total:lift+cardio,approx:!s.dur||(cm>0&&s.cardio.kcal==null),kg};
}
function activeKcal(){
  const kg=bwAt(Date.now()),c=S.active.cardio||{},cm=c.min||0;
  const h=Math.max(0,(Date.now()-S.active.startedAt)/3.6e6-cm/60);
  const lift=kg?MET[S.settings.effort]*kg*h:0,cardio=cardioKcal(c,kg);
  return {lift,cardio,total:lift+cardio,kg};
}
const kcalTxt=k=>k&&k.total?`${k.approx?'≈':''}${Math.round(k.total).toLocaleString()} kcal`:'';
const cardioHint=(c,kg)=>kg&&c.min?'≈ '+cardioKcal({min:c.min},kg):'from the machine';
function cardioLine(s){
  const c=s.cardio;if(!c)return '';
  const k=c.kcal!=null?c.kcal:sessionKcal(s).cardio;
  return `${c.min||0} min`+(k?` · ${c.kcal!=null?'':'≈'}${k} kcal`:'');
}
function cardioCard(){
  const c=S.active.cardio||(S.active.cardio={min:null,kcal:null}),kg=bwAt(Date.now());
  return `<div class="ex">
    <header>${iconOf({icon:'cardio'})}<div class="name">Cardio</div><div class="goal">after weights</div></header>
    <div class="cgrid">
      <label><span>Minutes</span><input type="number" inputmode="numeric" id="cMin" value="${c.min??''}" placeholder="0" enterkeyhint="next" oninput="onCardio()" onkeydown="if(event.key==='Enter'){event.preventDefault();$('cKcal').focus()}"></label>
      <label><span>Calories (kcal)</span><input type="number" inputmode="numeric" id="cKcal" value="${c.kcal??''}" placeholder="${cardioHint(c,kg)}" enterkeyhint="done" oninput="onCardio()" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"></label>
    </div>
    <div class="cnote" id="cNote"></div>
    ${kg?'':`<div style="padding:0 14px 12px"><button class="btn block" onclick="openBw()">Add your weight to count calories</button></div>`}
  </div>`;
}
function onCardio(){
  if(!S.active)return;
  const c=S.active.cardio||(S.active.cardio={});
  c.min=num($('cMin').value);c.kcal=num($('cKcal').value);save();
  $('cKcal').placeholder=cardioHint(c,bwAt(Date.now()));
  paintBar();
}
function paintCardioNote(k){
  const el=$('cNote');if(!el)return;
  if(!k.kg){el.textContent='Calories need your body weight.';return;}
  const c=S.active.cardio||{};
  el.textContent=`Burned so far ≈ ${Math.round(k.lift)} lifting`+(k.cardio?` + ${Math.round(k.cardio)} cardio${c.kcal==null?' (estimate)':''}`:'')+` = ${Math.round(k.total)} kcal`;
}
function setEffort(e){S.settings.effort=e;save();render();}

/* ---------- PROGRESS ---------- */
const DAY=864e5,round=n=>Math.round(n*10)/10;
const fmtKg=w=>String(round(w));
const compact=v=>v>=1e4?Math.round(v/1e3)+'k':v>=1e3?round(v/1e3)+'k':String(Math.round(v));
const chartW=()=>Math.max(240,Math.min(innerWidth,560)-62); // card content width, so 1 chart unit ≈ 1px
const weekStart=t=>{const d=dayStart(t);d.setDate(d.getDate()-(d.getDay()+6)%7);return d;};
const trainedDays=()=>new Set(S.sessions.map(s=>dayStart(s.date).getTime()));
const sortedBw=()=>[...S.bodyweight].sort((a,b)=>a.date-b.date);
function streakInfo(days){
  const list=[...days].sort((a,b)=>b-a);if(!list.length)return {n:0,since:null};
  const gap=(a,b)=>Math.round((a-b)/DAY),since=gap(dayStart(Date.now()).getTime(),list[0]);
  if(since>3)return {n:0,since};
  let n=1;while(n<list.length&&gap(list[n-1],list[n])<=3)n++;
  return {n,since};
}
function bwDelta(bws){
  if(!bws.length)return 'Log your weight to track it';
  if(bws.length<2)return 'First weigh-in '+shortDate(bws[0].date);
  const last=bws[bws.length-1],cut=last.date-30*DAY;let ref=bws[0];
  for(const b of bws)if(b.date<=cut)ref=b;
  const d=round(last.w-ref.w);
  return d===0?'Same as '+shortDate(ref.date):`${d>0?'▲ +':'▼ −'}${Math.abs(d)} kg since ${shortDate(ref.date)}`;
}
function viewProgress(){
  if(!S.sessions.length&&!S.bodyweight.length)return `<h1>Progress</h1><div class="empty" style="margin-top:16px"><b>Nothing to show yet</b>Finish your first workout and your progress shows up here.</div>`;
  return `<h1>Progress</h1>${secTiles()}${secCalendar()}${secStrength()}${secBody()}${secVolume()}`;
}
function secTiles(){
  const days=trainedDays(),today=dayStart(Date.now()).getTime(),ws=weekStart(Date.now());
  const wk=[...Array(7)].map((_,i)=>{const d=new Date(ws);d.setDate(ws.getDate()+i);return d.getTime();});
  const nWeek=wk.filter(t=>days.has(t)).length,st=streakInfo(days);
  const n28=[...days].filter(t=>t>today-28*DAY).length;
  const bws=sortedBw(),bw=bws[bws.length-1];
  const wo=n=>n===1?'workout':'workouts';
  return `<div class="kpis">
    <div class="kpi"><div class="l">This week</div><div class="v">${nWeek}<small>${wo(nWeek)}</small></div>
      <div class="wdots" aria-label="Days trained this week">${wk.map((t,i)=>`<span class="${days.has(t)?'on':''}${t===today?' today':''}"><i></i>${'MTWTFSS'[i]}</span>`).join('')}</div></div>
    <div class="kpi"><div class="l">Streak</div><div class="v">${st.n}<small>in a row</small></div>
      <div class="c">${st.n?'Never more than 3 days apart':st.since!=null?`Last workout ${st.since} days ago`:'Train to start one'}</div></div>
    <div class="kpi"><div class="l">Last 4 weeks</div><div class="v">${n28}<small>${wo(n28)}</small></div>
      <div class="c">${round(n28/4)} a week · goal 3–4</div></div>
    <div class="kpi"><div class="l">Body weight</div><div class="v">${bw?fmtKg(bw.w):'—'}<small>${bw?'kg':''}</small></div>
      <div class="c">${bwDelta(bws)}</div></div>
  </div>`;
}
function secCalendar(){
  const W=12,days=trainedDays(),today=dayStart(Date.now()).getTime(),start=weekStart(Date.now());
  start.setDate(start.getDate()-7*(W-1));
  const labels=[];let cells='';
  for(let w=0;w<W;w++){
    const ws=new Date(start);ws.setDate(start.getDate()+7*w);
    let lab=null;
    for(let d=0;d<7&&!lab;d++){const x=new Date(ws);x.setDate(ws.getDate()+d);if(x.getDate()===1)lab=x;}
    if(!lab&&w===0)lab=ws;
    if(lab)labels.push({w,txt:lab.toLocaleDateString(undefined,{month:'short'})});
    for(let d=0;d<7;d++){
      const x=new Date(ws);x.setDate(ws.getDate()+d);const t=x.getTime(),on=days.has(t),fut=t>today;
      const tip=fut?'':`data-tip="${on?'Workout':'Rest day'}" data-sub="${x.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}"`;
      cells+=`<i style="grid-column:${w+2};grid-row:${d+2}" class="${on?'on':''}${t===today?' today':''}${fut?' fut':''}" ${tip}></i>`;
    }
  }
  const ml=labels.filter((l,i)=>!(labels[i+1]&&labels[i+1].w-l.w<3)).map(l=>`<span class="ml" style="grid-column:${l.w+2}/span 3">${l.txt}</span>`).join('');
  const dl=[...'MTWTFSS'].map((c,i)=>`<span class="dl" style="grid-row:${i+2}">${i%2?'':c}</span>`).join('');
  const n=[...days].filter(t=>t>=start.getTime()).length;
  return `<div class="h2row"><h2>Consistency</h2><span>${n} ${n===1?'workout':'workouts'} in 12 weeks</span></div>
  <div class="card"><div class="cal">${ml}${dl}${cells}</div>
    <div class="legend"><span><i style="background:var(--gold)"></i>Workout</span><span><i style="background:var(--cell)"></i>Rest day</span><span>Every other day ≈ 3–4 a week</span></div></div>`;
}
const betterSet=(a,b,bw)=>bw?a.r>b.r:(a.w>b.w||(a.w===b.w&&a.r>b.r));
function liftStats(ex){
  const pts=[];
  for(const s of S.sessions){
    const e=s.exercises.find(x=>x.exId===ex.id);if(!e||!e.sets.length)continue;
    const noW=e.sets.every(t=>!t.w),top=e.sets.reduce((a,b)=>betterSet(b,a,noW)?b:a);
    pts.push({date:s.date,w:top.w||0,r:top.r,sets:e.sets});
  }
  if(!pts.length)return null;
  const bw=pts.every(p=>!p.w),val=p=>bw?p.r:p.w,first=pts[0],last=pts[pts.length-1];
  const best=pts.reduce((a,b)=>betterSet(b,a,bw)?b:a);
  let delta=bw?last.r-first.r:last.w-first.w,unit=bw?'reps':'kg';
  if(!bw&&delta===0&&last.r!==first.r){delta=last.r-first.r;unit='reps';}
  const newBest=pts.length>1&&pts.slice(0,-1).every(p=>betterSet(last,p,bw));
  return {pts,bw,val,first,last,best,delta:round(delta),unit,stronger:betterSet(last,first,bw),newBest};
}
const setTxt=(p,bw)=>bw?`${p.r} reps`:`${fmtKg(p.w)} kg × ${p.r}`;
function secStrength(){
  const rows=S.program.map(ex=>({ex,st:liftStats(ex)})).filter(r=>r.st);
  const head=`<div class="h2row"><h2>Getting stronger</h2>${rows.length?'<span>tap a lift for details</span>':''}</div>`;
  if(!rows.length)return head+`<div class="empty">Finish a workout to see your lifts here.</div>`;
  const cmp=rows.filter(r=>r.st.pts.length>1),up=cmp.filter(r=>r.st.stronger).length;
  const summary=cmp.length?`<div class="card"><div class="shv">${up}<small>of ${cmp.length} lifts</small></div>
    <div class="shl">are stronger than in your first workout</div>
    <div class="meter" role="img" aria-label="${up} of ${cmp.length} lifts stronger"><i style="width:${Math.round(up/cmp.length*100)}%"></i></div>
    <div class="sub small">Compares your best set in your first workout with your latest.</div></div>`
    :`<div class="card sub small">Do one more workout to compare each lift with your first one.</div>`;
  return head+summary+`<div class="lifts">${rows.map(r=>liftRow(r.ex,r.st)).join('')}</div>`;
}
function liftRow(ex,st){
  const open=progressEx===ex.id;
  const badge=st.pts.length<2?'<span class="chg">first</span>'
    :st.delta>0?`<span class="chg up">▲ +${st.delta} ${st.unit}</span>`
    :st.delta<0?`<span class="chg down">▼ −${-st.delta} ${st.unit}</span>`
    :'<span class="chg">same</span>';
  return `<div class="lift${open?' open':''}">
    <button class="lrow" onclick="toggleLift('${ex.id}')" aria-expanded="${open}">${iconOf(ex)}
      <span class="lmain"><span class="lname">${esc(ex.name)}</span><span class="lsub">${setTxt(st.last,st.bw)}${st.newBest?' · <span class="pr">★ new best</span>':''}</span></span>
      <span class="lright">${badge}${sparkline(st.pts.map(st.val))}</span>
    </button>${open?liftDetail(st):''}</div>`;
}
function liftDetail(st){
  const what=st.bw?'Most reps':'Heaviest set';
  const pts=st.pts.map(p=>({t:p.date,y:st.val(p),v:setTxt(p,st.bw),l:fmtDate(p.date)}));
  return `<div class="ldet">
    ${pts.length>1?`<div class="ctitle">${what} per workout${st.bw?'':', kg'}</div>${lineChart(pts,{label:what+' per workout'})}`:''}
    <div class="facts">
      ${[['First',st.first],['Best',st.best],['Latest',st.last]].map(([k,p])=>`<div><span>${k}</span><b>${st.bw?p.r+' reps':fmtKg(p.w)+' kg'}</b><em>${st.bw?'':'× '+p.r+' · '}${shortDate(p.date)}</em></div>`).join('')}
    </div>
    <details class="more"><summary>All ${st.pts.length} ${st.pts.length===1?'workout':'workouts'}</summary><div class="rows">${[...st.pts].reverse().map(p=>`<div><span>${fmtDate(p.date)}</span><span>${p.sets.map(t=>st.bw?`${t.r}`:`${fmtKg(t.w)}×${t.r}`).join('  ')}</span></div>`).join('')}</div></details>
  </div>`;
}
function toggleLift(id){progressEx=progressEx===id?null:id;render();}
function secBody(){
  const bws=sortedBw(),last=bws[bws.length-1];
  const chart=bws.length>1?lineChart(bws.map(b=>({t:b.date,y:b.w,v:fmtKg(b.w)+' kg',l:fmtDate(b.date)})),{dec:1,label:'Body weight over time'})
    :`<div class="sub small" style="margin-top:8px">${bws.length?'Log one more weigh-in to see the trend.':'Weigh in now and then, ideally at the same time of day.'}</div>`;
  return `<div class="h2row"><h2>Body weight</h2></div><div class="card">
    <div class="row" style="align-items:flex-end"><div class="grow"><div class="bigv">${last?fmtKg(last.w):'—'}<small>${last?'kg':''}</small></div><div class="sub small">${bwDelta(bws)}</div></div>
    <button class="btn" onclick="openBw()">Log weight</button></div>
    ${chart}
    ${bws.length?`<details class="more"><summary>All weigh-ins (${bws.length})</summary><div class="rows">${[...bws].reverse().map(b=>`<div><span>${fmtDate(b.date)}</span><span>${fmtKg(b.w)} kg<button class="xbtn" onclick="delBw(${b.date})" aria-label="Delete this weigh-in">✕</button></span></div>`).join('')}</div></details>`:''}
  </div>`;
}
function delBw(date){
  const b=S.bodyweight.find(x=>x.date===date);if(!b)return;
  askConfirm('Delete weigh-in?',`${fmtKg(b.w)} kg on ${fmtDate(b.date)}`,'Delete',()=>{S.bodyweight=S.bodyweight.filter(x=>x.date!==date);save();});
}
function secVolume(){
  if(!S.sessions.some(s=>s.exercises.some(e=>e.sets.length)))return '';
  const ss=S.sessions.filter(s=>s.exercises.some(e=>e.sets.length)).slice(-12),pts=ss.map(s=>({t:s.date,y:sessionVolume(s)}));
  return `<div class="h2row"><h2>Total lifted</h2><span>last ${ss.length} ${ss.length===1?'workout':'workouts'}</span></div><div class="card">
    <div class="sub small">Every set added up (weight × reps). Latest workout in gold.</div>
    ${barChart(pts)}
    <details class="more"><summary>Show numbers</summary><div class="rows">${[...ss].reverse().map(s=>`<div><span>${fmtDate(s.date)}</span><span>${Math.round(sessionVolume(s)).toLocaleString()} kg</span></div>`).join('')}</div></details>
  </div>`;
}

/* ---------- charts ---------- */
function niceStep(range,n){const raw=Math.max(range,1e-6)/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
function lineChart(pts,opt={}){
  const W=chartW(),H=168,pl=34,pr=12,pt=24,pb=24,dec=opt.dec||0;
  const ys=pts.map(p=>p.y);let lo=Math.min(...ys),hi=Math.max(...ys);
  if(hi-lo<1e-9){lo-=1;hi+=1;}
  const step=niceStep(hi-lo,3);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const t0=pts[0].t,span=Math.max(1,pts[pts.length-1].t-t0);
  const X=t=>pts.length<2?(pl+W-pr)/2:pl+(W-pl-pr)*(t-t0)/span,Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const P=pts.map(p=>({x:+X(p.t).toFixed(1),y:+Y(p.y).toFixed(1),val:p.y,v:p.v,l:p.l}));
  const fmt=v=>dec?(+v).toFixed(dec):String(round(v));
  let grid='';
  for(let v=lo;v<=hi+step/2;v+=step)grid+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${pl-6}" y="${Y(v)+4}" class="ax" text-anchor="end">${fmt(v)}</text>`;
  const line=P.map((p,i)=>`${i?'L':'M'}${p.x},${p.y}`).join('');
  const area=`${line}L${P[P.length-1].x},${H-pb}L${P[0].x},${H-pb}Z`;
  const dots=(P.length<=16?P:[P[P.length-1]]).map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="var(--gold)" stroke="var(--panel)" stroke-width="2"/>`).join('');
  const lab=p=>`<text x="${p.x}" y="${p.y-10}" class="dv" text-anchor="${p.x>W-pr-24?'end':p.x<pl+24?'start':'middle'}">${fmt(p.val)}</text>`;
  const last=P[P.length-1],mi=P.reduce((a,p,i)=>p.val>P[a].val?i:a,0);
  let labels=lab(last);
  if(mi!==P.length-1&&Math.abs(P[mi].x-last.x)>44)labels+=lab(P[mi]);
  const xl=P.length>1
    ?`<text x="${P[0].x}" y="${H-6}" class="ax" text-anchor="start">${shortDate(pts[0].t)}</text><text x="${last.x}" y="${H-6}" class="ax" text-anchor="end">${shortDate(pts[pts.length-1].t)}</text>`
    :`<text x="${last.x}" y="${H-6}" class="ax" text-anchor="middle">${shortDate(pts[0].t)}</text>`;
  return `<svg class="lc" data-cid="${regChart(P)}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label||'Chart')}">${grid}<path d="${area}" fill="var(--gold)" fill-opacity=".1"/><path d="${line}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line class="xh" x1="0" x2="0" y1="${pt-10}" y2="${H-pb}"/>${dots}${labels}<circle class="xd" cx="-20" cy="-20" r="5" fill="var(--gold)" stroke="var(--panel)" stroke-width="2"/>${xl}</svg>`;
}
function barChart(pts){
  const W=chartW(),H=158,pl=34,pr=6,pt=22,pb=24,n=pts.length;
  const max=Math.max(...pts.map(p=>p.y),1),step=niceStep(max,3),hi=Math.ceil(max/step)*step;
  const slot=(W-pl-pr)/n,bw=Math.max(2,Math.min(24,slot-4)),Y=v=>pt+(H-pt-pb)*(1-v/hi),base=H-pb;
  let grid='';
  for(let v=0;v<=hi+step/2;v+=step)grid+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${pl-6}" y="${Y(v)+4}" class="ax" text-anchor="end">${compact(v)}</text>`;
  const bars=pts.map((p,i)=>{
    const x=pl+slot*i+(slot-bw)/2,y=Y(p.y),h=base-y,r=Math.min(4,h,bw/2);
    const d=h>0.5?`M${x},${base}V${y+r}Q${x},${y} ${x+r},${y}H${x+bw-r}Q${x+bw},${y} ${x+bw},${y+r}V${base}Z`:'';
    return `<g data-tip="${Math.round(p.y).toLocaleString()} kg" data-sub="${fmtDate(p.t)}"><rect x="${pl+slot*i}" y="${pt}" width="${slot}" height="${base-pt}" fill="transparent"/><path d="${d}" fill="${i===n-1?'var(--gold)':'var(--deemph)'}"/></g>`;
  }).join('');
  const lx=pl+slot*(n-1)+slot/2,lv=pts[n-1];
  const lab=`<text x="${lx}" y="${Y(lv.y)-6}" class="dv" text-anchor="${lx>W-pr-20?'end':'middle'}">${compact(lv.y)}</text>`;
  const xl=`<text x="${pl+slot/2}" y="${H-6}" class="ax" text-anchor="${n>1?'start':'middle'}">${shortDate(pts[0].t)}</text>`+(n>1?`<text x="${lx}" y="${H-6}" class="ax" text-anchor="end">${shortDate(lv.t)}</text>`:'');
  return `<svg class="bc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Total lifted per workout">${grid}${bars}${lab}${xl}</svg>`;
}
function sparkline(vals){
  const v=vals.slice(-12),W=64,H=22,p=6;
  if(v.length<2)return `<svg class="spk" viewBox="0 0 ${W} ${H}" aria-hidden="true"><circle cx="${W-p}" cy="${H/2}" r="4" fill="var(--gold)"/></svg>`;
  let lo=Math.min(...v),hi=Math.max(...v);if(hi===lo){lo-=1;hi+=1;}
  const X=i=>p+(W-2*p)*i/(v.length-1),Y=x=>p+(H-2*p)*(1-(x-lo)/(hi-lo));
  return `<svg class="spk" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${v.map((x,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(x).toFixed(1)}`).join('')}" fill="none" stroke="var(--deemph)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(v.length-1).toFixed(1)}" cy="${Y(v[v.length-1]).toFixed(1)}" r="4" fill="var(--gold)" stroke="var(--panel)" stroke-width="2"/></svg>`;
}

/* chart tooltips: tap on a phone, hover on a computer */
let CH={},chN=0,tipOn=false;
function regChart(P){const id='c'+(++chN);CH[id]=P;return id;}
function showTip(v,l,x,y){
  const t=$('tip');if(!t)return;
  t.replaceChildren();
  const b=document.createElement('b');b.textContent=v;t.appendChild(b);
  if(l){const s=document.createElement('span');s.textContent=l;t.appendChild(s);}
  t.hidden=false;tipOn=true;
  const r=t.getBoundingClientRect();
  t.style.left=Math.max(8,Math.min(innerWidth-r.width-8,x-r.width/2))+'px';
  t.style.top=(y-r.height-12<8?y+14:y-r.height-12)+'px';
}
function hideTip(){
  if(!tipOn)return;tipOn=false;
  const t=$('tip');if(t)t.hidden=true;
  document.querySelectorAll('.lc .xh,.lc .xd').forEach(e=>e.style.opacity=0);
}
function chartPointer(e){
  const el=e.target;if(!el||!el.closest)return;
  const cell=el.closest('[data-tip]');
  if(cell){hideTip();const r=cell.getBoundingClientRect();showTip(cell.dataset.tip,cell.dataset.sub||'',r.left+r.width/2,r.top);return;}
  const svg=el.closest('svg[data-cid]');
  if(!svg){if(e.type==='pointerdown'||e.pointerType==='mouse')hideTip();return;}
  const P=CH[svg.dataset.cid],m=svg.getScreenCTM();if(!P||!P.length||!m)return;
  const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse());
  let q=P[0];for(const c of P)if(Math.abs(c.x-p.x)<Math.abs(q.x-p.x))q=c;
  hideTip();
  const xh=svg.querySelector('.xh'),xd=svg.querySelector('.xd');
  xh.setAttribute('x1',q.x);xh.setAttribute('x2',q.x);xh.style.opacity=1;
  xd.setAttribute('cx',q.x);xd.setAttribute('cy',q.y);xd.style.opacity=1;
  const sp=new DOMPoint(q.x,q.y).matrixTransform(m);
  showTip(q.v,q.l,sp.x,sp.y);
}
document.addEventListener('pointerdown',chartPointer,{passive:true});
document.addEventListener('pointermove',chartPointer,{passive:true});
window.addEventListener('scroll',hideTip,{passive:true});

/* ---------- MORE: history, backup ---------- */
function viewMore(){
  const st=S.settings,auto=Math.round(planFor(programCounts(),true).total/60),bws=sortedBw(),bwNow=bws[bws.length-1];
  return `<h1>More</h1>
  <h2>Timers</h2>
  <div class="card" style="padding:2px 14px">
    <div class="setting">
      <div class="t"><div>Rest between sets</div><div>Starts when you log a set</div></div>
      <div class="stepper"><button class="icon out" onclick="setRestDefault(-15)" aria-label="Shorter rest">−</button><b>${mmss(st.rest)}</b><button class="icon out" onclick="setRestDefault(15)" aria-label="Longer rest">+</button></div>
    </div>
    <div class="setting">
      <div class="t"><div>Workout target</div><div>Empty = auto, ${auto} min for your sets and rest</div></div>
      <input type="number" inputmode="numeric" placeholder="${auto}" value="${st.target??''}" onchange="setTarget(this.value)" aria-label="Workout target in minutes"><span class="sub small">min</span>
    </div>
    <div class="setting">
      <div class="t"><div>Sound</div><div>Beeps 3-2-1 and when rest ends</div></div>
      <button class="sw" role="switch" aria-checked="${!!st.sound}" aria-label="Sound" onclick="toggleSetting('sound')"></button>
    </div>
    <div class="setting">
      <div class="t"><div>Vibrate</div><div>When rest ends</div></div>
      <button class="sw" role="switch" aria-checked="${!!st.vibrate}" aria-label="Vibrate" onclick="toggleSetting('vibrate')"></button>
    </div>
    <div class="setting">
      <div class="t"><div>Keep screen on</div><div>During a workout, so the timer can beep</div></div>
      <button class="sw" role="switch" aria-checked="${!!st.awake}" aria-label="Keep screen on" onclick="toggleSetting('awake')"></button>
    </div>
    <div class="setting"><button class="btn block" onclick="testSound()">Test alarm</button></div>
  </div>
  <h2>Calories</h2>
  <div class="card" style="padding:2px 14px">
    <div class="setting">
      <div class="t"><div>Your weight</div><div>${bwNow?`${fmtKg(bwNow.w)} kg · logged ${shortDate(bwNow.date)}`:'Needed to count calories'}</div></div>
      <button class="btn" onclick="openBw()">Log weight</button>
    </div>
    <div class="setting">
      <div class="t"><div>Lifting effort</div><div>Hard = heavy weights, short rests</div></div>
      <div class="seg" role="group" aria-label="Lifting effort"><button class="${st.effort==='normal'?'on':''}" aria-pressed="${st.effort==='normal'}" onclick="setEffort('normal')">Normal</button><button class="${st.effort==='hard'?'on':''}" aria-pressed="${st.effort==='hard'}" onclick="setEffort('hard')">Hard</button></div>
    </div>
    <div class="setting"><div class="t"><div>How it's counted</div><div>Lifting ≈ ${MET[st.effort]} × your kg × hours of lifting${bwNow?`, about ${Math.round(MET[st.effort]*bwNow.w)} kcal an hour for you`:''}. Cardio uses the calories you type in; left empty, it's estimated.</div></div></div>
  </div>
  <h2>History</h2>
  <div style="margin:0 0 14px">
  ${S.sessions.length?[...S.sessions].reverse().map(s=>`<div class="hist">
    <div><div class="d">${fmtDate(s.date)} <span class="sub" style="font-weight:500">${[s.dur?Math.round(s.dur/60000)+' min':'',kcalTxt(sessionKcal(s))].filter(Boolean).map(x=>'· '+x).join(' ')}</span></div><div class="m">${[...s.exercises.filter(e=>e.sets.length).map(e=>esc(e.name)+' '+e.sets.map(t=>`${t.w}×${t.r}`).join(' ')),...(s.cardio?['Cardio '+cardioLine(s)]:[])].join(' · ')}</div></div>
    <button class="icon" onclick="delSession('${s.id}')" aria-label="Delete session">✕</button>
  </div>`).join(''):'<div class="sub">No workouts logged yet.</div>'}
  </div>
  <h2>Backup</h2>
  <div class="sub small" style="margin-bottom:10px">Your data lives on this device only. Export a backup now and then, or to move to a new phone.</div>
  <div class="row">
    <button class="btn grow" onclick="exportData()">Export backup</button>
    <button class="btn grow" onclick="document.getElementById('imp').click()">Import backup</button>
    <input id="imp" type="file" accept="application/json" style="display:none" onchange="importData(this)">
  </div>
  <button class="btn ghost danger block" style="margin-top:18px" onclick="wipe()">Erase all data</button>`;
}
function setRestDefault(d){S.settings.rest=Math.min(600,Math.max(15,S.settings.rest+d));save();render();}
function setTarget(v){const n=num(v);S.settings.target=n&&n>=5?Math.min(300,Math.round(n)):null;save();render();}
function toggleSetting(k){
  S.settings[k]=!S.settings[k];save();
  if(k==='awake')syncWakeLock();
  if(k==='sound'){if(S.settings.sound){unlockAudio();scheduleBeeps();}else cancelBeeps();}
  render();
}
function delSession(id){askConfirm('Delete workout?','This session is removed from history and charts.','Delete',()=>{S.sessions=S.sessions.filter(s=>s.id!==id);save();});}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=`loadbook-${new Date().toISOString().slice(0,10)}.json`;a.click();
}
function importData(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.program||!d.sessions)throw 0;S=d;normalize();save();cancelBeeps();syncWakeLock();render();toast('Backup restored');}catch(e){toast('That file is not a Loadbook backup');}};
  r.readAsText(f);inp.value='';
}
function wipe(){askConfirm('Erase all data?','All workouts and bodyweight logs are deleted and the program resets to Full-body A. This cannot be undone.','Erase everything',()=>{
  const keep=S.settings;
  S={program:DEFAULT_PROGRAM.map(([name,sets,reps,icon])=>({id:uid(),name,sets,reps,icon})),sessions:[],active:null,bodyweight:[],settings:keep};
  try{localStorage.removeItem(KEY);}catch(e){} normalize();save();cancelBeeps();syncWakeLock();tab='workout';toast('All data erased');});}

/* ---------- timers: workout pace + rest countdown ---------- */
// The pace plan, in seconds: warm-up allowance, time for one set, extra time to switch exercise.
// Rest between sets comes from settings (default 1:45).
const PLAN={warm:300,work:45,change:30};
function planFor(counts,ignoreTarget){
  const ends=[];let t=PLAN.warm,first=true;
  for(const n of counts)for(let i=0;i<n;i++){
    if(!first)t+=S.settings.rest+(i===0?PLAN.change:0);
    t+=PLAN.work;ends.push(t);first=false;
  }
  let total=t;
  if(S.settings.target&&!ignoreTarget&&ends.length){
    const k=S.settings.target*60/total;
    for(let i=0;i<ends.length;i++)ends[i]*=k;
    total=S.settings.target*60;
  }
  return {ends,total}; // ends[i] = when set i should be finished, counted from the start
}
const programCounts=()=>S.program.map(ex=>ex.sets);
const activeCounts=()=>S.program.map(ex=>(S.active.entries[ex.id]||[]).length);
const doneCount=()=>S.program.reduce((a,ex)=>a+(S.active.entries[ex.id]||[]).filter(s=>s.done).length,0);
function pace(){
  const {ends,total}=planFor(activeCounts());
  const el=Math.max(0,(Date.now()-S.active.startedAt)/1000),n=doneCount(),N=ends.length;
  let state='on',by=0;
  if(N&&n>=N)state='done';
  else if(N&&el>ends[n]){state='behind';by=el-ends[n];}      // the next set should already be finished
  else if(n>0&&el<ends[n-1]){state='ahead';by=ends[n-1]-el;} // finished more sets than planned by now
  return {ends,total,el,n,N,state,by};
}
function nextSet(){
  for(const ex of S.program){
    const sets=S.active.entries[ex.id]||[],i=sets.findIndex(s=>!s.done);
    if(i>=0){const last=lastSessionFor(ex.id);return {ex,i,n:sets.length,L:last&&last.sets[i]};}
  }
  return null;
}
let tickSig='',ticker=null;
function paintBar(){
  const bar=$('wbar');if(!bar||!S.active)return;
  const p=pace(),T=Math.max(p.total,1);
  $('wClock').textContent=mmss(p.el);
  $('wSets').textContent=`${p.n}/${p.N} sets`;
  $('wVol').textContent=Math.round(activeVolume()).toLocaleString()+' kg';
  $('wTarget').textContent=`target ${Math.round(p.total/60)} min`;
  const k=activeKcal();$('wKcal').textContent=k.kg?` · ${Math.round(k.total)} kcal`:'';paintCardioNote(k);
  $('wFill').style.width=Math.min(100,p.el/T*100)+'%';
  const sig=p.n+'|'+p.N+'|'+Math.round(T);
  if(sig!==tickSig){
    tickSig=sig;
    $('wTicks').innerHTML=p.ends.map((e,i)=>`<i class="${i<p.n?'d':i===p.n?'nx':''}" style="left:${Math.min(100,e/T*100).toFixed(2)}%"></i>`).join('');
  }
  $('wPace').textContent=p.state==='behind'?'Behind '+mmss(Math.ceil(p.by)):p.state==='ahead'?'Ahead '+mmss(Math.ceil(p.by)):p.state==='done'?'All sets done':'On pace';
  bar.className='wbar '+p.state;
}
function paintRest(){
  const el=$('rest'),r=S.active&&S.active.rest;
  document.body.classList.toggle('resting',!!r);
  if(!r){el.hidden=true;el.classList.remove('over');return;}
  el.hidden=false;
  const rem=(r.endsAt-Date.now())/1000,over=rem<=0;
  el.classList.toggle('over',over);
  $('rLabel').textContent=over?'Rest over · go':'Rest';
  $('rClock').textContent=over?'+'+mmss(-rem):mmss(Math.ceil(rem));
  $('rFill').style.width=(over?0:Math.min(100,rem/r.dur*100))+'%';
  $('rSkip').textContent=over?'OK':'Skip';
  const nx=nextSet();
  const txt=nx?`Next: ${nx.ex.name} · set ${nx.i+1}/${nx.n}${nx.L&&nx.L.w!=null?` · last ${nx.L.w} × ${nx.L.r}`:''}`:'All sets done · add cardio or tap Finish';
  if($('rNext').textContent!==txt)$('rNext').textContent=txt;
}
function startRest(key){
  if(!S.active)return;
  if(!nextSet()){S.active.rest=null;save();cancelBeeps();paintRest();toast('Last set done · add cardio or tap Finish');return;}
  S.active.rest={endsAt:Date.now()+S.settings.rest*1000,dur:S.settings.rest,key:key||'',alerted:false};
  save();scheduleBeeps();paintRest();
}
function adjustRest(d){
  const r=S.active&&S.active.rest;if(!r||r.alerted)return;
  if((r.endsAt-Date.now())/1000+d<=0){skipRest();return;}
  r.endsAt+=d*1000;r.dur=Math.max(1,r.dur+d);
  save();scheduleBeeps();paintRest();
}
function skipRest(){if(!S.active)return;S.active.rest=null;save();cancelBeeps();paintRest();}
function ensureTicker(){
  if(S.active&&!ticker)ticker=setInterval(tick,250);
  else if(!S.active&&ticker){clearInterval(ticker);ticker=null;}
}
function tick(){
  if(!S.active){ensureTicker();return;}
  const r=S.active.rest;
  if(r&&!r.alerted&&Date.now()>=r.endsAt){
    r.alerted=true;save();
    if(Date.now()-r.endsAt<8000)alarm(); else cancelBeeps(); // don't beep late after coming back to the app
  }
  paintRest();paintBar();
}
function alarm(){
  const r=S.active&&S.active.rest;
  if(S.settings.vibrate&&navigator.vibrate)try{navigator.vibrate([250,120,250,120,600]);}catch(e){}
  const scheduled=r&&beepsFor===r.endsAt&&AC&&AC.state==='running';
  if(S.settings.sound&&!scheduled&&AC&&AC.state==='running')beepPattern(AC.currentTime+0.02);
}

/* sound: short Web Audio beeps, scheduled ahead so they land exactly on time.
   They play over your music instead of stopping it. */
let AC=null,beepNodes=[],beepsFor=0,audioUnlocked=false;
function audioCtx(){
  if(AC)return AC;
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
  try{AC=new C();}catch(e){return null;}
  AC.onstatechange=()=>{if(AC.state==='running')scheduleBeeps();};
  return AC;
}
function unlockAudio(){
  if(S.active&&S.settings.awake&&!wakeLock)syncWakeLock();
  if(!S.settings.sound)return;
  const a=audioCtx();if(!a)return;
  if(a.state!=='running')a.resume().catch(()=>{});
  if(!audioUnlocked){try{const b=a.createBufferSource();b.buffer=a.createBuffer(1,1,22050);b.connect(a.destination);b.start(0);audioUnlocked=true;}catch(e){}}
}
['pointerup','touchend','keydown','click'].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));
function tone(f,at,d,v){
  const a=AC,o=a.createOscillator(),g=a.createGain();
  o.type='square';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,at);
  g.gain.exponentialRampToValueAtTime(v,at+0.01);
  g.gain.setValueAtTime(v,Math.max(at+0.011,at+d-0.04));
  g.gain.exponentialRampToValueAtTime(0.0001,at+d);
  o.connect(g);g.connect(a.destination);
  o.start(at);o.stop(at+d+0.02);
  return o;
}
function beepPattern(t0){return [tone(1760,t0,0.16,0.25),tone(1760,t0+0.24,0.16,0.25),tone(2349,t0+0.48,0.6,0.3)];}
function cancelBeeps(){
  beepNodes.forEach(o=>{try{o.stop();}catch(e){}try{o.disconnect();}catch(e){}});
  beepNodes=[];beepsFor=0;
}
function scheduleBeeps(){
  cancelBeeps();
  const r=S.active&&S.active.rest;
  if(!r||r.alerted||!S.settings.sound||!AC||AC.state!=='running')return;
  const rem=(r.endsAt-Date.now())/1000;if(rem<=0.05)return;
  const t0=AC.currentTime+rem;
  for(const k of [3,2,1])if(rem>k+0.1)beepNodes.push(tone(1175,t0-k,0.09,0.16));
  beepNodes.push(...beepPattern(t0));
  beepsFor=r.endsAt;
}
function testSound(){
  if(S.settings.vibrate&&navigator.vibrate)try{navigator.vibrate([250,120,250,120,600]);}catch(e){}
  const a=audioCtx();if(!a){toast('Sound is not supported in this browser');return;}
  const go=()=>beepPattern(a.currentTime+0.05);
  if(a.state==='running')go();else a.resume().then(go).catch(()=>toast('Tap again to allow sound'));
}

/* keep the screen on during a workout, so the timer keeps running and can beep */
let wakeLock=null,wlBusy=false;
async function syncWakeLock(){
  if(wlBusy)return;wlBusy=true;
  try{
    const want=!!(S.active&&S.settings.awake&&document.visibilityState==='visible'&&'wakeLock' in navigator);
    if(want&&!wakeLock){
      const w=await navigator.wakeLock.request('screen');wakeLock=w;
      w.addEventListener('release',()=>{if(wakeLock===w)wakeLock=null;});
    }else if(!want&&wakeLock){const w=wakeLock;wakeLock=null;await w.release();}
  }catch(e){}
  wlBusy=false;
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){syncWakeLock();scheduleBeeps();tick();}
});

render();
if(S.active)syncWakeLock();
</script>
